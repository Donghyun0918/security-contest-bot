name: security-contest-notify

on:
  schedule:
    # 주기를 바꾸려면 이 cron 식을 수정하세요.
    - cron: "0 3 * * *"   # 매일 UTC 03:00 = 한국시간(KST) 매일 낮 12:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scraper.main

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "변경사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: update seen.json [skip ci]"
            git push
          fi
